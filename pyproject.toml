[project]
name = "lc-agent-factory"
version = "0.0.1"
description = "Config-driven LangChain create_agent wrapper"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Beso", email = "beso.mikaberidze@gmail.com" }]
classifiers = [
  # For a complete list of classifiers, see https://pypi.org/classifiers/.
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "langchain>=1.2",
  "langgraph>=1.1",
  "langchain-core>=0.3",
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/bmikaberidze/lc-agent-factory"
Issues = "https://github.com/bmikaberidze/lc-agent-factory/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/lc_agent_factory"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
